services:
  infomentor-fetcher:
    build: .
    container_name: infomentor-fetcher
    restart: unless-stopped
    
    # Environment variables
    environment:
      # Required: Perplexity API key for LLM processing
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      
      # Optional: Gemini API key for LLM processing
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
      # Required: Telegram bot credentials
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

      # Timezone for scheduled runs (--at uses container local time)
      - TZ=${TZ:-Europe/Stockholm}

      # Disable UV telemetry
      - UV_NO_ANALYTICS=1
    
    # Volumes for persistent data
    volumes:
      # Token file (contains authentication tokens)
      - ./infomentor_tokens.json:/app/infomentor_tokens.json
      
      # News output directory
      - ./news:/app/news
      
      # Downloaded files directory
      - ./files:/app/files
    
    # Run once at start, then daily at 06:00 and 18:00 (see TZ above).
    # Other options:
    # command: ["fetch", "--once"]  # Run once and exit
    # command: ["fetch", "--interval", "3600"]  # Run every hour (3600 seconds)
    command: ["fetch", "--at", "06:00,18:00"]
    
    # For debugging, you can override to keep container running:
    # command: ["tail", "-f", "/dev/null"]
    
    # Shared memory size (needed for Chromium)
    shm_size: '2gb'
